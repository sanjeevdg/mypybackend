page:
  type: container

  props:
    maxWidth: sm
    sx:
      py: 6

  children:

    # =====================================================
    # PAGE
    # =====================================================

    - type: paper
      props:
        elevation: 3
        sx:
          p: 4
          borderRadius: 2

      children:

        # =================================================
        # TITLE
        # =================================================

        - type: typography
          props:
            variant: h4
            align: center
            gutterBottom: true
          text: "Password"

        # =================================================
        # DESCRIPTION
        # =================================================

        - type: typography
          props:
            variant: body2
            color: text.secondary
            align: center
            sx:
              mb: 3
          text: "Reset your password or change your existing password."


        # =================================================
        # EMAIL
        # =================================================

        - type: textfield
          props:
            label: "Email"
            name: email
            type: email
            fullWidth: true
            required: true
            sx:
              mb: 2
          binding: "passwordForm.email"


        # =================================================
        # CURRENT PASSWORD
        # =================================================

        - type: textfield
          props:
            label: "Current Password"
            name: current_password
            type: password
            fullWidth: true
            sx:
              mb: 2
          binding: "passwordForm.current_password"


        # =================================================
        # NEW PASSWORD
        # =================================================

        - type: textfield
          props:
            label: "New Password"
            name: new_password
            type: password
            fullWidth: true
            sx:
              mb: 2
          binding: "passwordForm.new_password"


        # =================================================
        # CONFIRM PASSWORD
        # =================================================

        - type: textfield
          props:
            label: "Confirm New Password"
            name: confirm_password
            type: password
            fullWidth: true
            sx:
              mb: 3
          binding: "passwordForm.confirm_password"


        # =================================================
        # FORGOT PASSWORD
        # =================================================

        - type: box
          props:
            sx:
              display: flex
              justifyContent: center
              mb: 2

          children:

            - type: button
              props:
                variant: text
                color: primary
              events:
                onClick: forgotPassword
              text: "Forgot Password?"


        # =================================================
        # ACTIONS
        # =================================================

        - type: box
          props:
            sx:
              display: flex
              gap: 2
              justifyContent: center

          children:

            - type: button
              props:
                variant: contained
                color: primary
              events:
                onClick: changePassword
              text: "Change Password"


            - type: button
              props:
                variant: outlined
                color: inherit
              events:
                onClick: cancel
              text: "Cancel"