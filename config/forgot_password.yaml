pages:
  dashboard:
    type: dashboard
    title: Forgot Password

    widgets:

    - id: container_forgot_password
      type: container
      title: Forgot Password

      layout:
        xs: 12
        md: 6
        offset: 3

      props:
        title: Forgot Password

      children:

      - id: textfield_reset_email
        type: textfield
        title: Email Address

        layout:
          xs: 12
          md: 12

        props:
          label: Registered Email Address
          field: email
          type: email
          required: true

      - id: button_send_reset_link
        type: button
        title: Send Reset Link

        layout:
          xs: 12
          md: 12

        text: Send Reset Link

        props:
          variant: contained

        events:
          onClick: sendPasswordReset

        feedback:
          success: If an account exists, a reset link will be sent.
          error: Unable to process password reset request.

      - id: button_back_login
        type: button
        title: Back to Login

        layout:
          xs: 12
          md: 12

        text: Back to Login

        props:
          variant: text

        events:
          onClick: backToLogin