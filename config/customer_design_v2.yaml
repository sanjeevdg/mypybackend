entities:
  customers:
    key: id
    fields:
    - name: id
      type: number
    - name: user_id
      type: number
      label: Linked User
      readonly: true
    - name: first_name
      type: text
      label: First Name
      required: true
    - name: last_name
      type: text
      label: Last Name
      required: true
    - name: email
      type: email
      label: Email
      required: true
    - name: age
      type: number
      label: Age
    - name: gender
      type: select
      label: Gender
      options:
      - Male
      - Female
      - Other
    - name: city
      type: select
      label: City
      options:
      - London
      - Paris
      - Delhi
      - Kolkata
      - Mumbai
      - Bangalore
    - name: active
      type: boolean
      label: Active
  inventory:
    key: id
    fields:
    - name: id
      type: number
    - name: sku
      type: text
      label: SKU
      required: true
    - name: name
      type: text
      label: Product Name
      required: true
    - name: description
      type: text
      label: Description
    - name: price
      type: currency
      label: Price
      required: true
    - name: stock_quantity
      type: number
      label: Stock Quantity
    - name: active
      type: boolean
      label: Active
    - name: images
      type: json
  orders:
    key: id
    fields:
    - name: id
      type: number
    - name: customer_id
      type: reference
      label: Customer
      readonly: false
      reference:
        entity: customers
        valueField: id
        labelField: first_name
        onDelete: cascade
    - name: order_date
      type: date
      label: Order Date
    - name: status
      type: select
      label: Status
      options:
      - draft
      - submitted
      - approved
      - shipped
      - delivered
      - cancelled
    - name: createdAt
      type: datetime
      label: Created At
      readonly: true
    - name: updatedAt
      type: datetime
      label: Updated At
      readonly: true
  order_items:
    key: id
    fields:
    - name: id
      type: number
    - name: order_id
      type: reference
      label: Order
      reference:
        entity: orders
        valueField: id
        labelField: id
        onDelete: cascade
    - name: product_id
      type: reference
      label: Product
      reference:
        entity: inventory
        valueField: id
        labelField: name
        onDelete: restrict
    - name: quantity
      type: number
      label: Quantity
    - name: amount
      type: currency
      label: Original Amount
    - name: discount_type
      type: text
      label: Discount Type
    - name: discount_value
      type: currency
      label: Discount Value
    - name: discount_amount
      type: currency
      label: Discount Amount
    - name: final_amount
      type: currency
      label: Final Amount
    - name: discount_batch_id
      type: number
      label: Discount Batch
    - name: createdAt
      type: datetime
      label: Created At
      readonly: true
    - name: updatedAt
      type: datetime
      label: Updated At
      readonly: true
  discount_batches:
    key: id
    fields:
    - name: id
      type: number
    - name: discount_type
      type: text
    - name: discount_value
      type: currency
    - name: product_ids
      type: json
    - name: discount_note
      type: text
    - name: applied_at
      type: datetime
    - name: applied_by
      type: number
  discount_batch_items:
    key: id
    fields:
    - name: id
      type: number
    - name: discount_batch_id
      type: reference
      label: Discount Batch
      reference:
        entity: discount_batches
        valueField: id
        labelField: id
        onDelete: cascade
    - name: order_item_id
      type: reference
      label: Order Item
      reference:
        entity: order_items
        valueField: id
        labelField: id
        onDelete: restrict
    - name: order_id
      type: reference
      label: Order
      reference:
        entity: orders
        valueField: id
        labelField: id
        onDelete: restrict
    - name: product_id
      type: reference
      label: Product
      reference:
        entity: inventory
        valueField: id
        labelField: name
        onDelete: restrict
    - name: quantity
      type: number
      label: Quantity
    - name: original_amount
      type: currency
      label: Original Amount
    - name: discount_type
      type: text
      label: Discount Type
    - name: discount_value
      type: currency
      label: Discount Value
    - name: discount_amount
      type: currency
      label: Discount Amount
    - name: final_amount
      type: currency
      label: Final Amount
    - name: createdAt
      type: datetime
      label: Created At
      readonly: true
    workflow:
      initialState: draft
      transitions:
      - action: submit
        label: Submit
        from: draft
        to: submitted
      - action: approve
        label: Approve
        from: submitted
        to: approved
      - action: ship
        label: Ship
        from: approved
        to: shipped
      - action: deliver
        label: Deliver
        from: shipped
        to: delivered
      - action: cancel
        label: Cancel
        from:
        - draft
        - submitted
        - approved
        to: cancelled
relationships:
- parent: customers
  child: orders
  parentKey: id
  childKey: customer_id
- parent: orders
  child: order_items
  parentKey: id
  childKey: order_id
navigation:
  enabled: true
  profiles:
    admin:
      brand:
        title: My File Utilities
      sidebar:
      - id: home
        label: Home
        route: /dashboard/dashboard_v2
        icon: dashboard
      - id: customers
        label: Customers
        route: /dashboard/customer_crud_v1
        icon: user
      - id: inventory
        label: Inventory
        route: /dashboard/inventory_crud_v1
        icon: inventory
      - id: orders
        label: Orders
        route: /dashboard/orders_crud_v4
        icon: shopping-cart
      - label: Apply Global Discount
        route: /apply-discount
        icon: LocalOffer
      - id: discount_history
        label: Discount History
        route: /dashboard/discount_history
        icon: History
      - id: designer
        label: Designer
        route: /designer
        icon: dashboard
      - id: logout
        label: Logout
        icon: logout
        action: logout
    user:
      brand:
        title: My Application
      topMenu:
      - id: profile
        label: Profile
        icon: user
        children:
        - id: my_profile
          label: My Profile
          route: /dashboard/user_profile
        - id: logout
          label: Logout
          action: logout
      sidebar:
      - id: dashboard
        label: Dashboard
        icon: dashboard
        route: /dashboard/customer_home
      - id: products
        label: Products
        icon: inventory
        route: /dashboard/new_frontend
      - id: orders
        label: Orders
        icon: shopping-cart
        route: /dashboard/my_orders
      - id: profile
        label: Profile
        icon: user
        route: /dashboard/user_profile
      - id: logout
        label: Logout
        icon: logout
        action: logout
pages:
  dashboard:
    type: dashboard
    title: Customer Design V2
    widgets:
    - id: tabs_1794059224095
      type: tabs
      title: New Tabs
      layout:
        xs: 12
        md: 12
      tabs:
      - id: tab_general_1794059224095
        label: Customers
        widgets:
        - id: textfield_1794059244823
          type: textfield
          title: First name
          layout:
            xs: 12
            md: 6
          props:
            formEntity: customers
            field: first_name
            label: Firstname
            required: true
        - id: textfield_1794059742986
          type: textfield
          title: Lastname
          layout:
            xs: 12
            md: 6
          props:
            formEntity: customers
            field: last_name
            label: Lastname
            required: true
        - id: textfield_1794059755404
          type: textfield
          title: Email
          layout:
            xs: 12
            md: 6
          props:
            formEntity: customers
            field: email
            label: Email
            required: true
            type: email
        - id: textfield_1794059760016
          type: textfield
          title: Age
          layout:
            xs: 12
            md: 6
          props:
            formEntity: customers
            field: age
            label: Age
            required: true
            numeric: true
        - id: select_1794059764394
          type: select
          title: Gender
          layout:
            xs: 12
            md: 6
          props:
            label: Gender
            formEntity: customers
            field: gender
            source:
              entity: customers
              valueField: gender
              labelField: gender
            required: true
        - id: select_1794059768134
          type: select
          title: City
          layout:
            xs: 12
            md: 6
          props:
            formEntity: customers
            field: city
            source:
              entity: customers
              valueField: city
              labelField: city
            required: true
            label: City
        - id: switch_1794059775225
          type: switch
          title: Active
          layout:
            xs: 12
            md: 6
          props:
            label: Active
        - id: button_1794059783782
          type: button
          title: New button
          layout:
            xs: 12
            md: 3
          text: Save
          props:
            variant: contained
          events:
            onClick: saveCustomer
          feedback:
            success: Save successful!
            error: Save unsuccessful!
        - id: button_1794059793271
          type: button
          title: New button
          layout:
            xs: 12
            md: 3
          text: Delete
          props:
            variant: contained
            color: warning
          events:
            onClick: deleteCustomer
          feedback:
            success: Delete successful!
            error: Delete unsuccessful!
        - id: datagrid_1794059850959
          type: datagrid
          title: Customer List
          layout:
            xs: 12
            md: 12
          source:
            entity: customers
            columns:
            - field: id
              label: id
            - field: user_id
              label: Linked User
            - field: first_name
              label: First Name
            - field: last_name
              label: Last Name
            - field: email
              label: Email
            - field: age
              label: Age
            - field: gender
              label: Gender
            - field: city
              label: City
            - field: active
              label: Active
      - id: tab_details_1794059224095
        label: Dashboard
        widgets:
        - id: chart_1794060590664
          type: chart
          title: 'Customers by city '
          layout:
            xs: 12
            md: 6
          chart:
            type: pie
            entity: customers
            x: id
            y: city
        - id: chart_1794060605269
          type: chart
          title: Customers by gender
          layout:
            xs: 12
            md: 6
          chart:
            type: line
            entity: customers
            x: gender
            y: id
        - id: stat_1794060611053
          type: stat
          title: Total Customers
          layout:
            xs: 12
            md: 6
          source:
            entity: customers
            aggregate: count
        - id: stat_1794060612842
          type: stat
          title: Some stat
          layout:
            xs: 12
            md: 6
          source:
            entity: customers
            aggregate: sum
            field: user_id
