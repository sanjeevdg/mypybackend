pages:
  dashboard:
    type: dashboard
    title: Customer Design V2
    widgets:
    - id: tabs_1794059224095
      type: tabs
      title: New Tabs
      layout:
        xs: 12
        md: 12
      tabs:
      - id: tab_general_1794059224095
        label: Customers
        widgets:
        - id: textfield_1794059244823
          type: textfield
          title: First name
          layout:
            xs: 12
            md: 6
          props:
            formEntity: customers
            field: first_name
            label: Firstname
            required: true
        - id: textfield_1794059742986
          type: textfield
          title: Lastname
          layout:
            xs: 12
            md: 6
          props:
            formEntity: customers
            field: last_name
            label: Lastname
            required: true
        - id: textfield_1794059755404
          type: textfield
          title: Email
          layout:
            xs: 12
            md: 6
          props:
            formEntity: customers
            field: email
            label: Email
            required: true
            type: email
        - id: textfield_1794059760016
          type: textfield
          title: Age
          layout:
            xs: 12
            md: 6
          props:
            formEntity: customers
            field: age
            label: Age
            required: true
            numeric: true
        - id: select_1794059764394
          type: select
          title: Gender
          layout:
            xs: 12
            md: 6
          props:
            label: Gender
            formEntity: customers
            field: gender
            source:
              entity: customers
              valueField: gender
              labelField: gender
            required: true
        - id: select_1794059768134
          type: select
          title: City
          layout:
            xs: 12
            md: 6
          props:
            formEntity: customers
            field: city
            source:
              entity: customers
              valueField: city
              labelField: city
            required: true
            label: City
        - id: switch_1794059775225
          type: switch
          title: Active
          layout:
            xs: 12
            md: 6
          props:
            label: Active
        - id: button_1794059783782
          type: button
          title: New button
          layout:
            xs: 12
            md: 3
          text: Save
          props:
            variant: contained
          events:
            onClick: saveCustomer
          feedback:
            success: Save successful!
            error: Save unsuccessful!
        - id: button_1794059793271
          type: button
          title: New button
          layout:
            xs: 12
            md: 3
          text: Delete
          props:
            variant: contained
            color: warning
          events:
            onClick: deleteCustomer
          feedback:
            success: Delete successful!
            error: Delete unsuccessful!
        - id: datagrid_1794059850959
          type: datagrid
          title: Customer List
          layout:
            xs: 12
            md: 12
          source:
            entity: customers
            columns:
            - field: id
              label: id
            - field: user_id
              label: Linked User
            - field: first_name
              label: First Name
            - field: last_name
              label: Last Name
            - field: email
              label: Email
            - field: age
              label: Age
            - field: gender
              label: Gender
            - field: city
              label: City
            - field: active
              label: Active
      - id: tab_details_1794059224095
        label: Dashboard
        widgets:
        - id: chart_1794060590664
          type: chart
          title: 'Customers by city '
          layout:
            xs: 12
            md: 6
          chart:
            type: pie
            entity: customers
            x: id
            y: city
        - id: chart_1794060605269
          type: chart
          title: Customers by gender
          layout:
            xs: 12
            md: 6
          chart:
            type: line
            entity: customers
            x: gender
            y: id
        - id: stat_1794060611053
          type: stat
          title: Total Customers
          layout:
            xs: 12
            md: 6
          source:
            entity: customers
            aggregate: count
        - id: stat_1794060612842
          type: stat
          title: 'Average Age of Customer '
          layout:
            xs: 12
            md: 6
          source:
            entity: customers
            aggregate: avg
            field: age
