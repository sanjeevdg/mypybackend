pages:
  dashboard:
    type: dashboard
    title: New Frontend
    widgets:
    - id: shoppingCart_1792733668138
      type: shoppingCart
      title: New shoppingCart
      layout:
        xs: 12
        md: 12
    - id: productCard_1792680623937
      type: productCard
      title: Product Card
      layout:
        xs: 12
        md: 12
      props:
        entity: inventory
        titleField: name
        descriptionField: description
        priceField: price
        imageField: images
        skuField: sku
        stockField: stock_quantity
        columns: 3
        imageMode: thumbnails
        showPrice: true
        showStock: true

navigation:
  enabled: true

  brand:
    title: My Application

  topMenu:
    - id: profile
      label: Profile
      icon: user
      children:
        - id: my_profile
          label: My Profile
          route: /dashboard/user_profile

        - id: logout
          label: Logout
          action: logout

  sidebar:
    - id: dashboard
      label: Dashboard
      icon: dashboard
      route: /dashboard/new_frontend

    - id: products
      label: Products
      icon: inventory
      route: /dashboard/inventory_crud_v1

    - id: orders
      label: Orders
      icon: shopping-cart
      route: /dashboard/orders

    - id: profile
      label: Profile
      icon: user
      route: /dashboard/user_profile

    - id: logout
      label: Logout
      icon: logout
      action: logout
        
entities:
  customers:
    key: id
    fields:
    - name: id
      type: number
    - name: user_id
      type: number
      label: Linked User
      readonly: true  
    - name: first_name
      type: text
      label: First Name
      required: true
    - name: last_name
      type: text
      label: Last Name
      required: true
    - name: email
      type: email
      label: Email
      required: true
    - name: age
      type: number
      label: Age
    - name: gender
      type: select
      label: Gender
      options:
      - Male
      - Female
      - Other
    - name: city
      type: select
      label: City
      options:
      - London
      - Paris
      - Delhi
      - Kolkata
      - Mumbai
      - Bangalore
    - name: active
      type: boolean
      label: Active
  inventory:
    key: id
    fields:
    - name: id
      type: number
    - name: sku
      type: text
      label: SKU
      required: true
    - name: name
      type: text
      label: Product Name
      required: true
    - name: description
      type: text
      label: Description
    - name: price
      type: currency
      label: Price
      required: true
    - name: stock_quantity
      type: number
      label: Stock Quantity
    - name: active
      type: boolean
      label: Active
    - name: images
      type: json
  orders:
    key: id
    fields:
    - name: id
      type: number
    - name: customer_id
      type: reference
      label: Customer
      readonly: false
      reference:
        entity: customers
        valueField: id
        labelField: first_name
        onDelete: cascade
    - name: order_date
      type: date
      label: Order Date
    - name: status
      type: select
      label: Status
      options:
      - draft
      - submitted
      - approved
      - shipped
      - delivered
      - cancelled
    - name: createdAt
      type: datetime
      label: Created At
      readonly: true
    - name: updatedAt
      type: datetime
      label: Updated At
      readonly: true
    workflow:
      initialState: draft
      transitions:
      - action: submit
        label: Submit
        from: draft
        to: submitted
      - action: approve
        label: Approve
        from: submitted
        to: approved
      - action: ship
        label: Ship
        from: approved
        to: shipped
      - action: deliver
        label: Deliver
        from: shipped
        to: delivered
      - action: cancel
        label: Cancel
        from:
        - draft
        - submitted
        - approved
        to: cancelled
  order_items:
    key: id
    fields:
    - name: id
      type: number
    - name: order_id
      type: reference
      label: Order
      reference:
        entity: orders
        valueField: id
        labelField: id
        onDelete: cascade
    - name: product_id
      type: reference
      label: Product
      reference:
        entity: inventory
        valueField: id
        labelField: name
        onDelete: restrict
    - name: quantity
      type: number
      label: Quantity
    - name: amount
      type: currency
      label: Amount
    - name: createdAt
      type: datetime
      label: Created At
      readonly: true
    - name: updatedAt
      type: datetime
      label: Updated At
      readonly: true
relationships:
- parent: customers
  child: orders
  parentKey: id
  childKey: customer_id
- parent: orders
  child: order_items
  parentKey: id
  childKey: order_id
