app:
  title: "Customer Order Management"


entities:

  customers:
    key: id

    fields:

      - name: id
        type: number

      - name: first_name
        type: text
        label: "First Name"
        required: true

      - name: last_name
        type: text
        label: "Last Name"
        required: true

      - name: email
        type: email
        label: "Email"
        required: true

      - name: age
        type: number
        label: "Age"

      - name: gender
        type: select
        label: "Gender"
        options:
        - Male
        - Female
        - Other

      - name: city
        type: select
        label: "City"
        options:
          - London
          - Paris
          - Delhi
          - Kolkata
          - Mumbai
          - Bangalore

      - name: active
        type: boolean
        label: "Active"

  orders:
    key: id

    fields:

      - name: id
        type: number

      - name: customer_id
        type: reference
        label: "Customer"
        readonly: false
        reference:
          entity: customers
          valueField: id
          labelField: first_name
          onDelete: cascade

      - name: order_date
        type: date
        label: "Order Date"

      - name: product
        type: text
        label: "Product"

      - name: quantity
        type: number
        label: "Quantity"

      - name: amount
        type: currency
        label: "Amount"

      - name: status
        type: select
        label: "Status"
        options:
          - draft
          - submitted
          - approved
          - shipped
          - delivered
          - cancelled


    workflow:

      initialState: draft

      transitions:

        - action: submit
          label: "Submit"
          from: draft
          to: submitted

        - action: approve
          label: "Approve"
          from: submitted
          to: approved

        - action: ship
          label: "Ship"
          from: approved
          to: shipped

        - action: deliver
          label: "Deliver"
          from: shipped
          to: delivered

        - action: cancel
          label: "Cancel"
          from:
            - draft
            - submitted
            - approved
          to: cancelled


relationships:

  - parent: customers
    child: orders
    parentKey: id
    childKey: customer_id


pages:

  
  customer:

    type: container

    props:
      maxWidth: xl
      sx:
        py: 3

    children:

      - type: typography
        props:
          variant: h4
          gutterBottom: true
        text: "Customer Management"


      - type: grid
        props:
          container: true
          spacing: 3

        children:

          # ==========================================
          # CUSTOMER MASTER
          # ==========================================

          - type: grid
            props:
              size:
                xs: 12
                md: 5

            children:

              - type: paper
                props:
                  elevation: 2
                  sx:
                    p: 2

                children:

                  - type: typography
                    props:
                      variant: h6
                      gutterBottom: true
                    text: "Customers"

                  
                  - type: button
                    props:
                      variant: contained
                      color: primary
                      sx:
                        mb: 2
                    events:
                      onClick: newCustomer
                    text: "New Customer"  


                  - type: textfield
                    props:
                      label: "Search customers"
                      name: customerSearch
                      fullWidth: true
                      size: small
                      sx:
                        mb: 2

                    events:
                      onChange: handleSearch


                  - type: table
                    props:
                      size: small

                    children:

                      - type: tableHead

                        children:

                          - type: tableRow

                            children:

                              - type: tableCell
                                text: "First Name"

                              - type: tableCell
                                text: "Last Name"

                              - type: tableCell
                                text: "Email"

                              - type: tableCell
                                text: "Active"


                      - type: tableBody

                        dataSource: customers

                        children:

                          - type: tableRow

                            events:
                              onClick: selectCustomer

                            props:
                              hover: true
                              sx:
                                cursor: pointer

                            children:

                              - type: tableCell
                                field: first_name

                              - type: tableCell
                                field: last_name

                              - type: tableCell
                                field: email

                              - type: tableCell
                                field: active


          # ==========================================
          # CUSTOMER DETAIL
          # ==========================================

          - type: grid

            props:
              size:
                xs: 12
                md: 7

            children:

              - type: paper

                props:
                  elevation: 2
                  sx:
                    p: 3

                children:

                  - type: typography
                    props:
                      variant: h6
                      gutterBottom: true
                    text: "Customer Details"


                  - type: form

                    entity: customers

                    binding: selectedUser

                    fields:

                      - id
                      - first_name
                      - last_name
                      - email
                      - age
                      - gender
                      - city
                      - active

                  # ==================================
                  # CUSTOMER ACTIONS
                  # ==================================

                  - type: box

                    props:
                      sx:
                        display: flex
                        gap: 2
                        mt: 3

                    children:

                      - type: button
                        props:
                          variant: contained
                          color: primary

                        events:
                          onClick: saveCustomer

                        text: "Save"


                      - type: button
                        props:
                          variant: outlined
                          color: error

                        events:
                          onClick: deleteCustomer

                        text: "Delete"      
                  # ==================================
                  # CUSTOMER ORDERS
                  # ==================================

                  - type: typography
                    props:
                      variant: h6
                      gutterBottom: true
                    text: "Orders"


                  - type: button
                    props:
                      variant: contained
                      color: primary
                      sx:
                        mb: 2

                    events:
                      onClick: newOrder

                    text: "New Order"


                  # ==================================
                  # ORDER FORM
                  # ==================================

                  - type: entityForm

                    entity: orders

                    binding: selectedOrder

                    

                    fields:
                      - customer_id
                      - order_date
                      - product
                      - quantity
                      - amount
                      - status

                    events:
                      onSave: saveOrder  
                  # ==================================
                  # EXISTING ORDERS
                  # ==================================

                  - type: childTable

                    entity: orders

                    dataSource: orders
                    
                    events:
                      onClick: selectOrder
                    
                    relationship:
                      parent: customers
                      parentKey: id
                      childKey: customer_id

                    parentBinding: selectedUser.id

                    columns:

                      - field: order_date
                        label: "Order Date"
                        type: date

                      - field: product
                        label: "Product"

                      - field: quantity
                        label: "Quantity"

                      - field: amount
                        label: "Amount"
                        type: currency

                      - field: status
                        label: "Status"


  dashboard:

    type: dashboard

    props:
      maxWidth: xl
      sx:
        py: 3

    title: "Customer Dashboard"

    widgets:

      - id: total_customers
        type: stat
        title: Total Customers

        source:
          entity: customers
          aggregate: count    


    customerList:
      entity: customers
      dataSource: customers

    customerSummary:
      entity: customers
      binding: selectedUser

    stats:

      - title: "Total Orders"
        entity: orders
        aggregate: count
        filter:
          field: customer_id
          binding: selectedUser.id

      - title: "Total Revenue"
        entity: orders
        field: amount
        aggregate: sum
        filter:
          field: customer_id
          binding: selectedUser.id

      - title: "Pending Orders"
        entity: orders
        field: status
        value: submitted
        aggregate: count
        filter:
          field: customer_id
          binding: selectedUser.id

      - title: "Approved Orders"
        entity: orders
        field: status
        value: approved
        aggregate: count
        filter:
          field: customer_id
          binding: selectedUser.id  

    chart:
      type: line
      title: "Order Revenue"
      entity: orders
      x: order_date
      y: amount    

    recentOrders:
      entity: orders
      dataSource: orders
      limit: 10

                     
