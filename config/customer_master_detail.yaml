app:
  title: "Customer Order Management"




pages:

  customer:
    type: container

    props:
      maxWidth: xl
      sx:
        py: 3

    children:

      - type: typography
        props:
          variant: h4
          gutterBottom: true
        text: "Customer Management"


      - type: grid
        props:
          container: true
          spacing: 3

        children:

          # ==========================================
          # CUSTOMER MASTER
          # ==========================================

          - type: grid
            props:
              size:
                xs: 12
                md: 5

            children:

              - type: paper
                props:
                  elevation: 2
                  sx:
                    p: 2

                children:

                  - type: typography
                    props:
                      variant: h6
                      gutterBottom: true
                    text: "Customers"

                  
                  - type: button
                    props:
                      variant: contained
                      color: primary
                      sx:
                        mb: 2
                    events:
                      onClick: newCustomer
                    text: "New Customer"  


                  - type: textfield
                    props:
                      label: "Search customers"
                      name: customerSearch
                      fullWidth: true
                      size: small
                      sx:
                        mb: 2

                    events:
                      onChange: handleSearch


                  - type: table
                    props:
                      size: small

                    children:

                      - type: tableHead

                        children:

                          - type: tableRow

                            children:

                              - type: tableCell
                                text: "First Name"

                              - type: tableCell
                                text: "Last Name"

                              - type: tableCell
                                text: "Email"

                              - type: tableCell
                                text: "Active"


                      - type: tableBody

                        dataSource: customers

                        children:

                          - type: tableRow

                            events:
                              onClick: selectCustomer

                            props:
                              hover: true
                              sx:
                                cursor: pointer

                            children:

                              - type: tableCell
                                field: first_name

                              - type: tableCell
                                field: last_name

                              - type: tableCell
                                field: email

                              - type: tableCell
                                field: active


          # ==========================================
          # CUSTOMER DETAIL
          # ==========================================

          - type: grid

            props:
              size:
                xs: 12
                md: 7

            children:

              - type: paper

                props:
                  elevation: 2
                  sx:
                    p: 3

                children:

                  - type: typography
                    props:
                      variant: h6
                      gutterBottom: true
                    text: "Customer Details"


                  - type: form

                    entity: customers

                    binding: selectedUser

                    fields:

                      - id
                      - first_name
                      - last_name
                      - email
                      - age
                      - gender
                      - city
                      - active

                  # ==================================
                  # CUSTOMER ACTIONS
                  # ==================================

                  - type: box

                    props:
                      sx:
                        display: flex
                        gap: 2
                        mt: 3

                    children:

                      - type: button
                        props:
                          variant: contained
                          color: primary

                        events:
                          onClick: saveCustomer

                        text: "Save"


                      - type: button
                        props:
                          variant: outlined
                          color: error

                        events:
                          onClick: deleteCustomer

                        text: "Delete"      
                  # ==================================
                  # CUSTOMER ORDERS
                  # ==================================

                  - type: typography
                    props:
                      variant: h6
                      gutterBottom: true
                    text: "Orders"


                  - type: button
                    props:
                      variant: contained
                      color: primary
                      sx:
                        mb: 2

                    events:
                      onClick: newOrder

                    text: "New Order"


                  # ==================================
                  # ORDER FORM
                  # ==================================

                  - type: entityForm

                    entity: orders

                    binding: selectedOrder

                    

                    fields:
                      - customer_id
                      - order_date
                      - product
                      - quantity
                      - amount
                      - status

                    events:
                      onSave: saveOrder  
                  # ==================================
                  # EXISTING ORDERS
                  # ==================================

                  - type: childTable

                    entity: orders

                    dataSource: orders
                    
                    events:
                      onClick: selectOrder
                    
                    relationship:
                      parent: customers
                      parentKey: id
                      childKey: customer_id

                    parentBinding: selectedUser.id

                    columns:

                      - field: order_date
                        label: "Order Date"
                        type: date

                      - field: product
                        label: "Product"

                      - field: quantity
                        label: "Quantity"

                      - field: amount
                        label: "Amount"
                        type: currency

                      - field: status
                        label: "Status"


  dashboard:

    type: dashboard

    props:
      maxWidth: xl
      sx:
        py: 3

    title: "Customer Dashboard"

    customerList:
      entity: customers
      dataSource: customers

    customerSummary:
      entity: customers
      binding: selectedUser

    widgets:

      - id: total_customers
        type: stat
        title: "Total Customers"
        layout:
          xs: 12
          sm: 6
          md: 3
        source:
          entity: customers
          aggregate: count


      - id: total_orders
        type: stat
        title: "Total Orders"
        layout:
          xs: 12
          sm: 6
          md: 3
        source:
          entity: orders
          aggregate: count

        filter:
          field: customer_id
          binding: selectedUser.id


      - id: total_revenue
        type: stat
        title: "Total Revenue"
        layout:
          xs: 12
          sm: 6
          md: 3
        source:
          entity: orders
          field: amount
          aggregate: sum

        filter:
          field: customer_id
          binding: selectedUser.id


      - id: pending_orders
        type: stat
        title: "Pending Orders"
        layout:
          xs: 12
          sm: 6
          md: 3
        source:
          entity: orders
          field: status
          aggregate: count
          value: submitted

        filter:
          field: customer_id
          binding: selectedUser.id


      - id: approved_orders
        type: stat
        title: "Approved Orders"
        layout:
          xs: 12
          sm: 6
          md: 3
        source:
          entity: orders
          field: status
          aggregate: count
          value: approved

        filter:
          field: customer_id
          binding: selectedUser.id
      
      - id: orders_over_time
        type: chart
        title: "Orders Over Time"
        layout:
          xs: 12
          md: 8
        chart:
          type: bar
          entity: orders
          x: order_date
          y: amount 
        filter:
          field: customer_id
          binding: selectedUser.id  

      - id: recent_orders
        type: table
        title: "Recent Orders"
        layout:
          xs: 12
        source:
          entity: orders
          limit: 10
        
          columns:
            - field: order_date
              label: Date
        
            - field: product
              label: Product
        
            - field: quantity
              label: Quantity
        
            - field: amount
              label: Amount
        
            - field: status
              label: Status
        
        filter:
          field: customer_id
          binding: selectedUser.id


      - id: customer_list
        type: table
        title: "Customers"
        layout:
          xs: 12
        source:
          entity: customers
          columns:
            - field: first_name
              label: First Name
            - field: last_name
              label: Last Name 
        select:
          action: selectCustomer      

      - id: customer_summary
        type: detail
        title: "Customer Details"
        layout:
          xs: 12
        source:
          entity: customers
          binding: selectedUser

        fields:
          - field: first_name
            label: First Name

          - field: last_name
            label: Last Name

          - field: email
            label: Email

          - field: city
            label: City




    chart:
      type: line
      title: "Order Revenue"
      entity: orders
      x: order_date
      y: amount    



                     
