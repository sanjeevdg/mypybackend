pages:
  dashboard:
    type: dashboard
    title: Orders Crud V2
    widgets:
    - id: container_1791292263537
      type: container
      title: New container
      layout:
        xs: 12
        md: 12
      props:
        title: Container
      children:
      - id: datagrid_1791292288404
        type: datagrid
        title: Orders List - click a row to edit
        layout:
          xs: 12
          md: 6
        source:
          entity: orders
          columns:
          - field: id
            label: id
          - field: customer_id__display
            label: Customer
          - field: order_date
            label: Order Date
          - field: status
            label: Status
          - field: createdAt
            label: Created At
          - field: updatedAt
            label: Updated At
      - id: order_items_grid
        type: datagrid
        title: Order Items
        layout:
          xs: 12
          md: 12
        source:
          entity: order_items
          filter:
            field: order_id
            valueFrom: formData.id
          columns:
          - field: product_id__display
            label: Product
          - field: quantity
            label: Quantity
          - field: amount
            label: Amount
    - id: container_1790950935727
      type: container
      title: New container
      layout:
        xs: 12
        md: 12
      props:
        title: Container
      children:
      - id: select_1790950969188
        type: select
        title: New select
        layout:
          xs: 12
          md: 6
        props:
          source:
            entity: customers
            valueField: id
            labelField: first_name
          field: customer_id
          label: Select Customer
          formEntity: orders
          required: true
      - id: select_1790951008667
        type: select
        title: New select
        layout:
          xs: 12
          md: 6
        props:
          label: Status
          options:
          - value: Draft
            label: Draft
          - value: Submitted
            label: Submitted
          - value: Approved
            label: Approved
          - value: Delivered
            label: Delivered
          formEntity: orders
          field: status
          required: true
      - id: datePicker_1791357307128
        type: datePicker
        title: Date
        layout:
          xs: 12
          md: 6
        props:
          field: order_date
          label: Order Date
          formEntity: orders
          defaultValue: ''
          required: true
          readOnly: false
          entity: orders
    - id: container_1790951213242
      type: container
      title: New container
      layout:
        xs: 12
        md: 12
      props:
        title: Container
      children:
      - id: button_1790951279332
        type: button
        title: New button
        layout:
          xs: 12
          md: 6
        text: Save
        props:
          variant: contained
        events:
          onClick: saveOrder
        feedback:
          success: Order save success
          error: order save failed
      - id: detailgrid_test
        type: detailGrid
        title: Order Items
        props:
          detailField: orderItems
          source:
            entity: order_items
          columns:
          - field: product_id
            label: Product
          - field: quantity
            label: Quantity
          - field: amount
            label: Amount
entities:
  customers:
    key: id
    fields:
    - name: id
      type: number
    - name: first_name
      type: text
      label: First Name
      required: true
    - name: last_name
      type: text
      label: Last Name
      required: true
    - name: email
      type: email
      label: Email
      required: true
    - name: age
      type: number
      label: Age
    - name: gender
      type: select
      label: Gender
      options:
      - Male
      - Female
      - Other
    - name: city
      type: select
      label: City
      options:
      - London
      - Paris
      - Delhi
      - Kolkata
      - Mumbai
      - Bangalore
    - name: active
      type: boolean
      label: Active
  inventory:
    key: id
    fields:
    - name: id
      type: number
    - name: sku
      type: text
      label: SKU
      required: true
    - name: name
      type: text
      label: Product Name
      required: true
    - name: description
      type: text
      label: Description
    - name: price
      type: currency
      label: Price
      required: true
    - name: stock_quantity
      type: number
      label: Stock Quantity
    - name: active
      type: boolean
      label: Active
  orders:
    key: id
    fields:
    - name: id
      type: number
    - name: customer_id
      type: reference
      label: Customer
      readonly: false
      reference:
        entity: customers
        valueField: id
        labelField: first_name
        onDelete: cascade
    - name: order_date
      type: date
      label: Order Date
    - name: status
      type: select
      label: Status
      options:
      - draft
      - submitted
      - approved
      - shipped
      - delivered
      - cancelled
    - name: createdAt
      type: datetime
      label: Created At
      readonly: true
    - name: updatedAt
      type: datetime
      label: Updated At
      readonly: true
    workflow:
      initialState: draft
      transitions:
      - action: submit
        label: Submit
        from: draft
        to: submitted
      - action: approve
        label: Approve
        from: submitted
        to: approved
      - action: ship
        label: Ship
        from: approved
        to: shipped
      - action: deliver
        label: Deliver
        from: shipped
        to: delivered
      - action: cancel
        label: Cancel
        from:
        - draft
        - submitted
        - approved
        to: cancelled
  order_items:
    key: id
    fields:
    - name: id
      type: number
    - name: order_id
      type: reference
      label: Order
      reference:
        entity: orders
        valueField: id
        labelField: id
        onDelete: cascade
    - name: product_id
      type: reference
      label: Product
      reference:
        entity: inventory
        valueField: id
        labelField: name
        onDelete: restrict
    - name: quantity
      type: number
      label: Quantity
    - name: amount
      type: currency
      label: Amount
    - name: createdAt
      type: datetime
      label: Created At
      readonly: true
    - name: updatedAt
      type: datetime
      label: Updated At
      readonly: true
relationships:
- parent: customers
  child: orders
  parentKey: id
  childKey: customer_id
- parent: orders
  child: order_items
  parentKey: id
  childKey: order_id
