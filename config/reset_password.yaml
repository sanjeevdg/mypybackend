
pages:
  dashboard:
    type: dashboard
    title: Reset Password
    widgets:
      - id: container_reset_password
        type: container
        title: Reset Password
        layout:
          xs: 12
          md: 6
          offset: 3
        props:
          title: Reset Password
        children:
          - id: textfield_new_password
            type: textfield
            title: New Password
            layout:
              xs: 12
              md: 12
            props:
              label: New Password
              field: new_password
              type: password
              required: true

          - id: textfield_confirm_password
            type: textfield
            title: Confirm Password
            layout:
              xs: 12
              md: 12
            props:
              label: Confirm New Password
              field: confirm_password
              type: password
              required: true

          - id: button_reset_password
            type: button
            title: Reset Password
            layout:
              xs: 12
              md: 12
            text: Reset Password
            props:
              variant: contained
            events:
              onClick: resetPassword

          - id: button_back_login
            type: button
            title: Back to Login
            layout:
              xs: 12
              md: 12
            text: Back to Login
            props:
              variant: text
            events:
              onClick: backToLogin
