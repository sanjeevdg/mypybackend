pages:
  dashboard:
    type: dashboard
    title: New User Signup
    entity: customers
    widgets:
    - id: typography_1789907992299
      type: typography
      title: New typography
      layout:
        xs: 12
        md: 12
      text: All fields are required.
      props:
        variant: h6
        align: left
    - id: textfield_1789906881496
      type: textfield
      title: New textfield
      layout:
        xs: 12
        md: 6
      props:
        label: Firstname
        field: first_name
        required: true
        formEntity: customers
      alignment: right
    - id: textfield_1789906882736
      type: textfield
      title: New textfield
      layout:
        xs: 12
        md: 6
      props:
        label: Lastname
        field: last_name
        required: true
        formEntity: customers
    - id: textfield_1789906886441
      type: textfield
      title: New textfield
      layout:
        xs: 12
        md: 6
      props:
        label: Email
        field: email
        required: true
        formEntity: customers
        type: email
    - id: textfield_1789906887484
      type: textfield
      title: New textfield
      layout:
        xs: 12
        md: 6
      props:
        label: Age
        field: age
        formEntity: customers
        required: true
        numeric: true
    - id: select_1789906929029
      type: select
      title: New select
      layout:
        xs: 12
        md: 6
      props:
        label: Gender
        field: gender
        options:
        - value: Male
          label: Male
        - value: Female
          label: Female
        - value: Other
          label: Other
        formEntity: customers
        source:
          entity: customers
          valueField: ''
          labelField: ''
        required: true
    - id: select_1789907051023
      type: select
      title: New select
      layout:
        xs: 12
        md: 6
      props:
        label: City
        options:
        - value: Mumbai
          label: Mumbai
        - value: Delhi
          label: Delhi
        - value: Kolkata
          label: Kolkata
        - value: Chennai
          label: Chennai
        - value: Bangalore
          label: Bangalore
        - value: Pune
          label: Pune
        field: city
        formEntity: customers
        source:
          entity: customers
          valueField: ''
          labelField: ''
        required: true
    - id: button_1789908052351
      type: button
      title: New button
      layout:
        xs: 12
        md: 12
      text: Sign up
      props:
        variant: contained
        size: large
        fullWidth: true
      events:
        onClick: saveCustomer
      feedback:
        success: Your account created successfully!
        error: Account creation failure
entities:
  customers:
    key: id
    fields:
    - name: id
      type: number
    - name: first_name
      type: text
      label: First Name
      required: true
    - name: last_name
      type: text
      label: Last Name
      required: true
    - name: email
      type: email
      label: Email
      required: true
    - name: age
      type: number
      label: Age
    - name: gender
      type: select
      label: Gender
      options:
      - Male
      - Female
      - Other
    - name: city
      type: select
      label: City
      options:
      - London
      - Paris
      - Delhi
      - Kolkata
      - Mumbai
      - Bangalore
    - name: active
      type: boolean
      label: Active
  inventory:
    key: id
    fields:
    - name: id
      type: number
    - name: sku
      type: text
      label: SKU
      required: true
    - name: name
      type: text
      label: Product Name
      required: true
    - name: description
      type: text
      label: Description
    - name: price
      type: currency
      label: Price
      required: true
    - name: stock_quantity
      type: number
      label: Stock Quantity
    - name: active
      type: boolean
      label: Active
  orders:
    key: id
    fields:
    - name: id
      type: number
    - name: customer_id
      type: reference
      label: Customer
      readonly: false
      reference:
        entity: customers
        valueField: id
        labelField: first_name
        onDelete: cascade
    - name: order_date
      type: date
      label: Order Date
    - name: status
      type: select
      label: Status
      options:
      - draft
      - submitted
      - approved
      - shipped
      - delivered
      - cancelled
    - name: createdAt
      type: datetime
      label: Created At
      readonly: true
    - name: updatedAt
      type: datetime
      label: Updated At
      readonly: true
    workflow:
      initialState: draft
      transitions:
      - action: submit
        label: Submit
        from: draft
        to: submitted
      - action: approve
        label: Approve
        from: submitted
        to: approved
      - action: ship
        label: Ship
        from: approved
        to: shipped
      - action: deliver
        label: Deliver
        from: shipped
        to: delivered
      - action: cancel
        label: Cancel
        from:
        - draft
        - submitted
        - approved
        to: cancelled
  order_items:
    key: id
    fields:
    - name: id
      type: number
    - name: order_id
      type: reference
      label: Order
      reference:
        entity: orders
        valueField: id
        labelField: id
        onDelete: cascade
    - name: product_id
      type: reference
      label: Product
      reference:
        entity: inventory
        valueField: id
        labelField: name
        onDelete: restrict
    - name: quantity
      type: number
      label: Quantity
    - name: amount
      type: currency
      label: Amount
    - name: createdAt
      type: datetime
      label: Created At
      readonly: true
    - name: updatedAt
      type: datetime
      label: Updated At
      readonly: true
relationships:
- parent: customers
  child: orders
  parentKey: id
  childKey: customer_id
- parent: orders
  child: order_items
  parentKey: id
  childKey: order_id
