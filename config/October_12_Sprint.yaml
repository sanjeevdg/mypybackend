        props:
          label: Firstname
          formEntity: customers
          field: first_name
      - id: textfield_1791779915347
        type: textfield
        title: New textfield
        layout:
          xs: 12
          md: 6
        props:
          formEntity: customers
          field: last_name
          label: Lastname
      - id: textfield_1791779924155
        type: textfield
        title: New textfield
        layout:
          xs: 12
          md: 6
        props:
          formEntity: customers
          field: email
          label: Email
          required: true
      - id: textfield_1791779930360
        type: textfield
        title: New textfield
        layout:
          xs: 12
          md: 6
        props:
          label: Age
          formEntity: customers
          field: age
      - id: select_1791779937815
        type: select
        title: New select
        layout:
          xs: 12
          md: 6
        props:
          formEntity: customers
          field: gender
