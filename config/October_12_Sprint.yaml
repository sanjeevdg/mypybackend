        title: New typography
        layout:
          xs: 12
          md: 6
        text: Customer List (Click a row to edit.)
        props:
          variant: h4
          align: center
      - id: datagrid_1791779853625
        type: datagrid
        title: New datagrid
        layout:
          xs: 12
          md: 6
        source:
          entity: customers
          columns:
          - field: id
            label: id
          - field: first_name
            label: First Name
          - field: last_name
            label: Last Name
          - field: email
