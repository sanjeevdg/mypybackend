app:
  title: Customer Manager

entity:
  name: Customer

fields:
  - name: first_name
    label: First Name
    type: text

  - name: last_name
    label: Last Name
    type: text

  - name: age
    label: Age
    type: number

  - name: email
    label: Email
    type: email  

  - name: active
    label: Active
    type: checkbox  

buttons:
  - save
  - cancel

table:

  columns:

    - first_name

    - last_name

    - age

    - active
